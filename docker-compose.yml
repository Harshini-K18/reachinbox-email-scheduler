services:
  postgres:
    image: postgres:16
    container_name: reachinbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reachinbox
      POSTGRES_PASSWORD: reachinbox
      POSTGRES_DB: reachinbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: reachinbox-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: